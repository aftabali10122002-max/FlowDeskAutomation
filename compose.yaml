services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set a local SQL Server password}
    ports:
      - "127.0.0.1:${FLOWDESK_SQL_PORT:-1433}:1433"
    volumes:
      - database-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'echo > /dev/tcp/127.0.0.1/1433'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    profiles:
      - local-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=FlowDeskLocal;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set a local SQL Server password};Encrypt=True;TrustServerCertificate=True"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env to a random key of at least 32 bytes}
      Jwt__Issuer: FlowDesk.Local
      Jwt__Audience: FlowDesk.Local
      ProfileImages__StoragePath: /var/lib/flowdesk/ProfileImages
      Attachments__StoragePath: /var/lib/flowdesk/RequestAttachments
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FLOWDESK_HTTP_PORT:-8080}:8080"
    volumes:
      - private-files:/var/lib/flowdesk
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  database-data:
  private-files:
